name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # 手元と同じバージョンに固定（"latest" だとHugo更新で突然壊れることがある）
          hugo-version: "0.151.0"
          extended: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: hugo --minify

      # 公開用の画像だけを縮小（content内の元画像はそのまま）
      # 長辺2000pxを超えるJPEG/PNGを縮小し、JPEGは品質82で再圧縮
      - name: Optimize images
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          find public -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -size +300k -print0 \
            | xargs -0 -r -P 4 -I{} mogrify -auto-orient -resize '2000x2000>' -strip -quality 82 {}
          du -sh public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
