baseURL = "https://snu-o.com/"
languageCode = "ja"
defaultContentLanguage = "ja"
defaultContentLanguageInSubdir = false
title = "s.n.u"
theme = "hugo-book"

[params]
  author = "s.n.u"
  ShowReadingTime = false
  defaultTheme = "auto"
  BookToC = false
  BookDateFormat = "2006-01-02"
  BookTheme = "auto"
  BookSearch = true
  BookSection = '*'
  BookLogo = 'img/snu_logo2.svg'
  googleAnalyticsID = "G-RLWDBB3H3R"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
      hardWraps = true

[permalinks]
  posts = "/:title/"

# --- 日英2言語 ---
# 日本語: content/<ページ>/index.md     → https://snu-o.com/<ページ>/
# 英語  : content/<ページ>/index.en.md  → https://snu-o.com/en/<ページ>/
[languages]
  [languages.ja]
    languageName = "日本語"
    languageCode = "ja"
    weight = 1
  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 2
